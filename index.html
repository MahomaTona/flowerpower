<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1412" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlowerPower" id="apple-title" />
    <link rel="icon" href="favicon.svg" id="favicon" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" id="apple-icon" />
    <link rel="manifest" href="manifest.webmanifest" id="manifest" />
    <title>FlowerPower</title>
    <script>
      // Läuft vor allem anderen: Theme setzen und im diskreten Modus Name/Icon neutral halten.
      (function () {
        var p = new URLSearchParams(location.search).get('p') || '';
        var ns = 'fp' + (p ? '-' + p : '') + '.';
        try {
          var theme = localStorage.getItem(ns + 'theme') || 'cuvee';
          document.documentElement.dataset.theme = theme;
          if (localStorage.getItem(ns + 'discreet') === '1') {
            document.title = 'Notizen';
            document.getElementById('manifest').href = 'manifest-discreet.webmanifest';
            document.getElementById('favicon').href = 'note.svg';
            document.getElementById('apple-icon').href = 'apple-touch-icon-note.png';
            document.getElementById('apple-title').content = 'Notizen';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
